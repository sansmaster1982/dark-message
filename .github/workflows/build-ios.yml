name: Build & Upload iOS to App Store

# This is a MONOREPO: android/ and ios/ side by side. A push that only touches
# android/ has nothing for Xcode to build, so it never queues this workflow at all -
# not that it costs anything here (public-repo Actions minutes are free on every
# runner including macOS), but there is no reason to run a 4-minute macOS job for a
# Kotlin-only change either.
on:
  push:
    branches: [master]
    paths:
      - "ios/**"
      - ".github/workflows/build-ios.yml"
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload the signed build to App Store Connect"
        type: boolean
        default: true

env:
  APP_NAME: DarkMessage
  BUNDLE_ID: com.darkmessage.ios
  SCHEME: DarkMessage
  XCODEGEN_VERSION: "2.42.0"

# Every `run:` step below is a bare command written for the iOS project living at
# the repo root, back when this workflow's own repo WAS the iOS project. In this
# monorepo the same files live under ios/, and this one line is the whole fix -
# nothing below had to change.
defaults:
  run:
    working-directory: ios

jobs:
  # Runs the XCTest suites on an iOS Simulator. A SEPARATE job on purpose: it does
  # not gate the release build, so a broken test can never stop a build from
  # reaching Apple, and the two run at the same time. Until this existed the 43
  # iOS tests had never executed anywhere - there is no Swift compiler on the
  # development machine, and the archive step does not build the test target.
  test:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using Xcode at: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          # Whatever iPhone this runner image happens to ship; the name changes
          # with every Xcode release, so never hardcode one.
          NAME=$(xcrun simctl list devices available | grep -oE "iPhone [0-9]+[^(]*" | head -1 | sed 's/ *$//')
          echo "Using simulator: $NAME"
          echo "name=$NAME" >> $GITHUB_OUTPUT

      # Signed ad-hoc rather than CODE_SIGNING_ALLOWED=NO. An unsigned app has no
      # keychain entitlement on the simulator, so SecItemAdd fails and every chat
      # created by a UI test reports no passphrase - a CI artefact that looks
      # exactly like a real bug.
      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test             -project DarkMessage.xcodeproj             -scheme "$SCHEME"             -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}"             -resultBundlePath TestResults.xcresult             CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES             | tee xcodebuild.log | tail -60

      - name: What failed
        if: failure()
        run: |
          # `tail` above shows the end of a 10 000-line log, which is rarely where
          # the failure is. A UI test reports the reason on the assertion line.
          grep -n "error:\|failed\|XCTAssert\|Assertion Failure" xcodebuild.log | tail -40 || true

      - name: Summarise
        if: always()
        run: |
          xcrun xcresulttool get test-results summary --path TestResults.xcresult 2>/dev/null             || echo "no result bundle"

  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      # ── 1. Checkout ──
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Select Xcode version ──
      - name: Select latest Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using Xcode at: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      # ── 3. Install XcodeGen ──
      - name: Install XcodeGen
        run: brew install xcodegen

      # ── 4. Generate Xcode project ──
      - name: Generate Xcode project
        run: xcodegen generate

      # ── 5. Resolve Swift Package dependencies ──
      - name: Resolve SPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ${{ env.APP_NAME }}.xcodeproj \
            -scheme ${{ env.SCHEME }}

      # ── 6. Set unique build number ──
      - name: Set build number
        run: |
          BUILD_NUMBER=$(date +%y%m%d%H%M)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" DarkMessage/Info.plist
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "Build number: $BUILD_NUMBER"

      # ── 7. Install Apple certificate and provisioning profile ──
      - name: Install signing credentials
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Decode certificate and profile
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 \
            -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" \
            $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # Install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

          # Extract profile UUID for ExportOptions
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin \
            <<< $(security cms -D -i $PP_PATH))
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV
          echo "Profile UUID: $PROFILE_UUID"

      # ── 8. Detect signing identity ──
      - name: Detect signing identity
        run: |
          IDENTITY=$(security find-identity -v -p codesigning $RUNNER_TEMP/app-signing.keychain-db \
            | grep "iPhone Distribution\|Apple Distribution" \
            | head -1 \
            | sed 's/.*"\(.*\)".*/\1/')
          echo "SIGNING_IDENTITY=$IDENTITY" >> $GITHUB_ENV
          echo "Signing identity: $IDENTITY"

      # ── 9. Archive ──
      - name: Archive
        run: |
          xcodebuild archive \
            -project ${{ env.APP_NAME }}.xcodeproj \
            -scheme ${{ env.SCHEME }} \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/${{ env.APP_NAME }}.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="${{ env.SIGNING_IDENTITY }}" \
            PROVISIONING_PROFILE_SPECIFIER="${{ env.PROFILE_UUID }}" \
            PRODUCT_BUNDLE_IDENTIFIER=${{ env.BUNDLE_ID }} \
            -allowProvisioningUpdates \
            COMPILER_INDEX_STORE_ENABLE=NO

      # ── 10. Create ExportOptions.plist ──
      - name: Create ExportOptions.plist
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>destination</key>
              <string>upload</string>
              <key>teamID</key>
              <string>${TEAM_ID}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${{ env.BUNDLE_ID }}</key>
                  <string>${{ env.PROFILE_UUID }}</string>
              </dict>
              <key>uploadSymbols</key>
              <true/>
              <key>uploadBitcode</key>
              <false/>
          </dict>
          </plist>
          PLIST

      # ── 11. Export & Upload to App Store Connect ──
      # Skipped when the run was started by hand with upload=false, or when the commit
      # message contains [no-upload]. Every other push still publishes the build, so a
      # change can be compile-checked on a real Xcode without sending anything to Apple.
      - name: Upload to App Store Connect
        if: >-
          ${{ !(github.event_name == 'workflow_dispatch' && inputs.upload == false)
              && !contains(github.event.head_commit.message, '[no-upload]') }}
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          # Write API key file
          mkdir -p ~/.private_keys
          echo -n "$APP_STORE_CONNECT_API_KEY" | base64 --decode \
            > ~/.private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

          # Export and upload in one step using app-store-connect method
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/${{ env.APP_NAME }}.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8 \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      # ── 12. Cleanup keychain ──
      - name: Cleanup
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
